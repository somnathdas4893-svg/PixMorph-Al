<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="45%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Glass Overlay Reflection -->
    <radialGradient id="glassShine" cx="25%" cy="20%" r="75%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- App Icon Base Card with Rounded Corners -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" filter="url(#shadow)"/>
  <rect width="512" height="512" rx="116" fill="url(#glassShine)"/>

  <!-- Inner Magic Frame / Photo Placeholder -->
  <g transform="translate(96, 96)">
    <rect x="20" y="32" width="280" height="220" rx="42" fill="none" stroke="#ffffff" stroke-width="22" stroke-linejoin="round" opacity="0.9"/>
    <!-- Camera Lens / Sun -->
    <circle cx="92" cy="106" r="22" fill="#ffffff" opacity="0.95"/>
    <!-- Mountain / Landscape AI Graph -->
    <path d="M 36 210 L 110 134 L 160 184 L 230 110 L 284 210 Z" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
  </g>

  <!-- Sparkle / AI Magic Star (Top Right) -->
  <g transform="translate(360, 96)">
    <path d="M 32 0 C 32 18 46 32 64 32 C 46 32 32 46 32 64 C 32 46 18 32 0 32 C 18 32 32 18 32 0 Z" fill="#fff" filter="url(#shadow)"/>
  </g>

  <!-- Small Sparkle (Bottom Left) -->
  <g transform="translate(80, 360)">
    <path d="M 18 0 C 18 10 26 18 36 18 C 26 18 18 26 18 36 C 18 26 10 18 0 18 C 10 18 18 10 18 0 Z" fill="#22d3ee" opacity="0.9"/>
  </g>
</svg>
